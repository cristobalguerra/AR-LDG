<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Componer — Trama</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav-brand">TRAMA</a>
    <div class="nav-links">
      <a href="index.html">Inicio</a>
      <a href="composer.html" class="active">Componer</a>
    </div>
  </nav>

  <div class="composer">

    <aside class="composer-panel" id="composerPanel">
      <button class="panel-toggle" id="panelToggle" aria-label="Colapsar panel">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>

      <div class="panel-scroll">

        <div class="panel-group">
          <h4>Fuente</h4>
          <div class="source-buttons">
            <button class="btn btn-secondary btn-sm" id="btnUpload">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              Subir
            </button>
            <button class="btn btn-secondary btn-sm" id="btnWebcam">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
              Webcam
            </button>
            <button class="btn btn-secondary btn-sm" id="btnDemo">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>
              Demo
            </button>
            <input type="file" id="fileInput" accept="image/*" hidden>
          </div>
          <div class="source-status" id="sourceStatus">Sin fuente</div>
        </div>

        <div class="panel-group">
          <h4>Grilla</h4>
          <label class="range-row">
            <span>Densidad <em id="gridLabel">60</em></span>
            <input type="range" id="gridDensity" min="10" max="140" value="60">
          </label>
          <label class="range-row">
            <span>Espaciado <em id="spacingLabel">0</em></span>
            <input type="range" id="gridSpacing" min="0" max="6" step="1" value="0">
          </label>
          <label class="range-row">
            <span>Tamaño <em id="sizeLabel">100%</em></span>
            <input type="range" id="shapeSize" min="30" max="130" value="100">
          </label>
        </div>

        <div class="panel-group">
          <h4>Umbrales tonales</h4>
          <label class="range-row">
            <span>Sombra ≤ <em id="lowLabel">85</em></span>
            <input type="range" id="lowThr" min="20" max="120" value="85">
          </label>
          <label class="range-row">
            <span>Medio ≤ <em id="highLabel">170</em></span>
            <input type="range" id="highThr" min="120" max="230" value="170">
          </label>
        </div>

        <div class="panel-group band-group" data-band="shadow">
          <h4><span class="band-dot" data-band="shadow"></span> Sombras</h4>
          <div class="shape-picker" data-band="shadow"></div>
          <div class="band-row">
            <label class="color-row">
              <span>Color</span>
              <input type="color" data-band="shadow" data-key="color" value="#e8ff47">
            </label>
            <label class="glyph-row">
              <span>Glifo</span>
              <input type="text" data-band="shadow" data-key="glyph" maxlength="2" placeholder="—">
            </label>
          </div>
        </div>

        <div class="panel-group band-group" data-band="mid">
          <h4><span class="band-dot" data-band="mid"></span> Medios</h4>
          <div class="shape-picker" data-band="mid"></div>
          <div class="band-row">
            <label class="color-row">
              <span>Color</span>
              <input type="color" data-band="mid" data-key="color" value="#888888">
            </label>
            <label class="glyph-row">
              <span>Glifo</span>
              <input type="text" data-band="mid" data-key="glyph" maxlength="2" placeholder="—">
            </label>
          </div>
        </div>

        <div class="panel-group band-group" data-band="highlight">
          <h4><span class="band-dot" data-band="highlight"></span> Altas luces</h4>
          <div class="shape-picker" data-band="highlight"></div>
          <div class="band-row">
            <label class="color-row">
              <span>Color</span>
              <input type="color" data-band="highlight" data-key="color" value="#ffffff">
            </label>
            <label class="glyph-row">
              <span>Glifo</span>
              <input type="text" data-band="highlight" data-key="glyph" maxlength="2" placeholder="—">
            </label>
          </div>
        </div>

        <div class="panel-group">
          <h4>Fondo</h4>
          <label class="color-row">
            <span>Color de fondo</span>
            <input type="color" id="bgColor" value="#0a0a0a">
          </label>
          <label class="range-row">
            <span>Invertir tonos</span>
            <input type="checkbox" id="invertTones">
          </label>
        </div>

        <div class="panel-group">
          <h4>Presets</h4>
          <div class="presets" id="presets"></div>
        </div>

        <div class="panel-group panel-actions">
          <button class="btn btn-primary btn-sm" id="btnDownload">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Descargar PNG
          </button>
          <button class="btn btn-secondary btn-sm" id="btnShare">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
            Copiar link
          </button>
        </div>

      </div>
    </aside>

    <main class="composer-stage">
      <div class="stage-toolbar">
        <span class="stage-hint" id="stageHint">Subí una imagen, abrí webcam o probá un preset.</span>
        <span class="stage-meta" id="stageMeta"></span>
      </div>
      <div class="canvas-wrap">
        <canvas id="canvas"></canvas>
        <video id="webcam" playsinline autoplay muted hidden></video>
      </div>
    </main>

  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="js/composer.js"></script>

</body>
</html>
